name: build-agent-zero-codex

on:
  push:
    branches: ["codex-auth"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build -t ghcr.io/fislysandi/agent-zero-codex:latest .

      - name: Push image
        run: |
          docker push ghcr.io/fislysandi/agent-zero-codex:latest
